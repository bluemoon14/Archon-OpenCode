# E2E smoke test — Pydantic AI provider (BYO agent)
# Verifies: bridge spawn via `uv run --script`, agent import, query stream,
#           terminal `result` envelope with tokens.
# Requires: `uv` on PATH (or UV_BIN_PATH set), OPENAI_API_KEY for the smoke
# agent's upstream, and the following config in .archon/config.yaml:
#
#   assistants:
#     pydantic:
#       agents:
#         smoke: { entry: .archon/agents/smoke.py }
name: e2e-pydantic-smoke
description: "Smoke test for Pydantic AI provider. Verifies BYO agent round-trip."
provider: pydantic

nodes:
  # 1. Agent selects via the `agent:` node field (mandatory for pydantic).
  - id: simple
    agent: smoke
    prompt: "What is 2+2? Answer with just the number, nothing else."
    idle_timeout: 120000 # allow for uv cold-start

  # 2. Assert non-empty output.
  - id: assert
    bash: |
      output="$simple.output"
      if [ -z "$output" ]; then
        echo "FAIL: simple node returned empty output"
        exit 1
      fi
      echo "PASS: simple=$output"
    depends_on: [simple]
